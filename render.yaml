services:
  - type: web
    name: memento-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HINDSIGHT_BASE_URL
        value: https://api.hindsight.vectorize.io
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: HINDSIGHT_BANK_ID
        value: memento-demo-final
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: SEED_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
